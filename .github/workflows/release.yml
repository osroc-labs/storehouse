name: Release

# A `v*` tag publishes that version to npm, in three jobs, so the tagged commit's own code never
# runs where npm's OIDC token can be minted. `verify` runs the whole gate, site included. `pack`
# installs only the library (no site toolchain) and packs it. Both have no id-token. `publish` only
# checks the tarball's hash and publishes it, with no checkout and no install.
# This file comes from the tagged commit too, so the tag ruleset and the `npm` environment's
# rules (docs/development.md) are the real gate; the checks here catch an honest mistake.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # all of history, to check the tag is on master; the token needn't stay in .git/config
          fetch-depth: 0
          persist-credentials: false
      # First, before any of the commit's own code runs.
      - name: Check the tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that isn't on master."
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The tag is the version: v0.1.0 publishes 0.1.0, and a mismatch stops here.
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but package.json says ${version}."
            exit 1
          fi

  pack:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that isn't on master."
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      # The library and its own dependencies only: the site's toolchain never runs where the
      # tarball is made.
      - run: pnpm install --frozen-lockfile --filter @osroc-labs/storehouse
      # pnpm pack swaps catalog: versions for real ones; publish checks it gets these exact bytes.
      - id: pack
        name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          pnpm pack --pack-destination "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          tarball="$(ls osroc-labs-storehouse-*.tgz)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Node 24.22.1 ships npm 11.19.1; trusted publishing needs 11.5.1 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - name: Check npm and the tarball
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          if [ "$(npm --version)" != "11.19.1" ]; then
            echo "::error::Expected npm 11.19.1, got $(npm --version)."
            exit 1
          fi
          cd "$RUNNER_TEMP/package"
          echo "${SHA256}  ${TARBALL}" | sha256sum --check --strict
      - name: Publish
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: npm publish "$RUNNER_TEMP/package/${TARBALL}" --provenance --access public --ignore-scripts
